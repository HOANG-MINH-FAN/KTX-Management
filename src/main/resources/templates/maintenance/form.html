<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Báo sửa chữa')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>

    <div class="main-content">
        <header class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-tools"></i> Báo sửa chữa phòng ở</div>
                <div class="topbar-subtitle">Gửi yêu cầu hỗ trợ kỹ thuật cho phòng đang lưu trú</div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-ghost" th:href="@{/maintenance}">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>
        </header>

        <main class="page-content">
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <section class="card form-container-md">
                <div class="card-header">
                    <span class="card-title"><i class="bi bi-Clipboard2-pulse"></i> Thông tin sự cố</span>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="bi bi-door-open"></i>
                        <span>Phòng đang ở: <strong th:text="${room.roomNumber}"></strong></span>
                    </div>

                    <form th:action="@{/maintenance/new}" method="post">
                        <div class="form-group">
                            <label class="form-label" for="title">Tiêu đề sự cố *</label>
                            <input id="title" name="title" type="text" class="form-control"
                                   maxlength="150" required
                                   placeholder="Ví dụ: Đèn tuýp phòng bị hỏng, vòi nước rò rỉ...">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Mô tả chi tiết *</label>
                            <textarea id="description" name="description" class="form-control"
                                      rows="5" required
                                      placeholder="Mô tả tình trạng, vị trí cụ thể và thời điểm xảy ra sự cố..."></textarea>
                        </div>

                        <div class="flex gap-2" style="margin-top: 20px;">
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-send"></i> Gửi yêu cầu
                            </button>
                            <a class="btn btn-ghost" th:href="@{/maintenance}">Hủy</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
