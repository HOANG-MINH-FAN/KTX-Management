<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phòng</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/input.css">
</head>
<body>

    <div th:replace="header :: header"></div>

    <h1 class="main_text">Quản lý phòng</h1>

    <form action="/rooms/save" method="post" class="room_form">
        <div><label>Tòa nhà:</label><input type="text" name="building" required></div>
        <div><label>Phòng:</label><input type="text" name="roomNumber" required></div>
        <div><label>Tầng:</label><input type="number" name="floor" required></div>
        <div><label>Sức chứa:</label><input type="number" name="capacity" required></div>
        <button type="submit">Thêm phòng</button>
    </form>

    <table class="table">
        <tr>
            <th>ID</th>
            <th>Tòa nhà</th>
            <th>Phòng</th>
            <th>Tầng</th>
            <th>Sức chứa</th>
            <th>Đã sử dụng</th>
            <th>Trạng thái</th>
        </tr>

        <tr th:each="r : ${rooms}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.building}"></td>
            <td th:text="${r.roomNumber}"></td>
            <td th:text="${r.floor}"></td>
            <td th:text="${r.capacity}"></td>
            <td th:text="${r.occupied}"></td>
            <td th:text="${r.status}"></td>
            <td>
                <form th:action="@{'/rooms/delete/' + ${r.id}}" method="post" style="display:inline;">
                    <button type="submit" class="table_btn">Xóa</button>
                </form>
            </td>
        </tr>

    </table>

</body>
</html>
