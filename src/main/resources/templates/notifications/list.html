<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/sidebar :: head('Thông báo')}"></head>

<body>
<div class="layout">

    <!-- Hiển thị sidebar theo vai trò đang đăng nhập -->
    <th:block sec:authorize="hasRole('ADMIN')">
        <div th:replace="~{layout/sidebar :: adminSidebar}"></div>
    </th:block>

    <th:block sec:authorize="hasRole('STUDENT')">
        <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    </th:block>

    <div class="main-content">

        <!-- Topbar -->
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-bell"></i> Thông báo hệ thống</div>
                <div class="topbar-subtitle">Các thông báo và cập nhật từ Ban quản lý KTX</div>
            </div>
            <div class="topbar-right">
                <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-arrow-left"></i> Trang chủ
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>
            </div>
        </div>

        <main class="page-content">

            <section class="card">
                <div class="card-header">
                    <span class="card-title"><i class="bi bi-envelope-paper"></i> Danh sách thông báo</span>
                    <span class="text-secondary text-sm">
                        Chưa đọc: <strong th:text="${unreadCount}" class="text-primary">0</strong>
                    </span>
                </div>

                <!-- Không có thông báo -->
                <div class="empty-state" th:if="${notifications == null or notifications.isEmpty()}">
                    <div class="icon"><i class="bi bi-bell-slash"></i></div>
                    <h3>Bạn chưa có thông báo nào</h3>
                    <p>Khi có cập nhật mới về phòng ở, hóa đơn hoặc giao dịch, thông báo sẽ xuất hiện tại đây.</p>
                </div>

                <!-- Danh sách thông báo -->
                <div class="notification-list" style="border: none; border-radius: 0;" th:if="${notifications != null and !notifications.isEmpty()}">
                    <div th:each="n : ${notifications}"
                         class="notification-item"
                         th:classappend="${!n.read ? 'unread' : ''}">

                        <div class="flex-between gap-3" style="align-items: flex-start;">
                            <div style="flex: 1; min-width: 0;">
                                <div class="flex-center gap-2" style="margin-bottom: 4px;">
                                    <i class="bi" th:classappend="${!n.read ? 'bi-bell-fill text-primary' : 'bi-bell text-muted'}"></i>
                                    <span class="font-bold" th:text="${n.title}">Tiêu đề</span>
                                </div>

                                <div class="text-secondary" style="line-height: 1.55; margin-bottom: 8px;" th:text="${n.message}">
                                    Nội dung thông báo
                                </div>

                                <div class="text-muted text-sm">
                                    <i class="bi bi-clock"></i>
                                    <span th:if="${n.createdAt != null}"
                                          th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">
                                        06/10/2026 20:00
                                    </span>
                                </div>
                            </div>

                            <div class="flex-center gap-2" style="flex-shrink: 0;">
                                <span th:if="${!n.read}" class="badge badge-info">Chưa đọc</span>
                                <span th:if="${n.read}" class="badge badge-secondary">Đã đọc</span>
                                <form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post" style="display: inline;">
                                    <button class="btn btn-primary btn-sm" type="submit">
                                        <i class="bi bi-check2"></i> Đánh dấu đã đọc
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>

    </div>
</div>
</body>
</html>
