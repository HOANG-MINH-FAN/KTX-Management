<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - KTX Management</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ktx-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', saved);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body>

<div class="login-page">
    <div class="login-topbar">
        <button type="button" class="theme-toggle-btn" data-theme-toggle="true"></button>
    </div>

    <div class="login-box">
        <!-- Logo -->
        <div class="login-logo">
            <div class="icon-wrap"><i class="bi bi-buildings"></i></div>
            <h1>KTX Management</h1>
            <p>Hệ thống Quản lý Ký túc xá Đại học</p>
        </div>

        <!-- Alert lỗi / thành công -->
        <div class="alert alert-error" th:if="${param.error}">
            <i class="bi bi-exclamation-circle"></i>
            <span>Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            <i class="bi bi-check-circle"></i>
            <span>Đã đăng xuất khỏi hệ thống.</span>
        </div>

        <!-- Form đăng nhập Spring Security -->
        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input id="username" class="form-control" type="text"
                       name="username" placeholder="Nhập mã sinh viên hoặc tài khoản" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input id="password" class="form-control" type="password"
                       name="password" placeholder="Nhập mật khẩu" required>
            </div>

            <button class="login-btn" type="submit">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập hệ thống
            </button>
        </form>
    </div>
</div>

</body>
</html>
