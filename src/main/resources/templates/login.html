<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - KTX Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-page">
    <div class="login-box">
        <!-- Logo -->
        <div class="login-logo">
            <div class="icon-wrap">🏠</div>
            <h1>KTX Management</h1>
            <p>Hệ thống Quản lý Ký túc xá Sinh viên</p>
        </div>

        <!-- Alert lỗi / thành công -->
        <div class="alert alert-error" th:if="${param.error}">
            ⚠️ Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            ✅ Đã đăng xuất thành công.
        </div>

        <!-- Form đăng nhập Spring Security -->
        <form method="post" th:action="@{/login}">
            <!-- CSRF Token tự động do Thymeleaf + Spring Security inject -->
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input id="username" class="form-control" type="text"
                       name="username" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input id="password" class="form-control" type="password"
                       name="password" placeholder="Nhập mật khẩu" required>
            </div>

            <button class="login-btn" type="submit">🔐 Đăng nhập</button>
        </form>

        <p class="text-muted text-sm" style="text-align:center; margin-top:20px;">
            Admin: <strong>admin</strong> / <strong>admin@123</strong><br>
            SV mẫu: <strong>sv001</strong> / <strong>sv@123456</strong>
        </p>
    </div>
</div>

</body>
</html>
