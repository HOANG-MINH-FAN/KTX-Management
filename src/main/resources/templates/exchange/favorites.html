<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Tin đã lưu')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-bookmark-heart"></i> Tin đã lưu</div>
                <div class="topbar-subtitle">Danh sách các món đồ bạn đã đánh dấu quan tâm</div>
            </div>
            <div class="topbar-right">
                <a th:href="@{/exchange}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-shop"></i> Về chợ đồ
                </a>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card">
                <div class="empty-state" th:if="${items.isEmpty()}">
                    <div class="icon"><i class="bi bi-bookmark"></i></div>
                    <h3>Bạn chưa lưu tin nào</h3>
                    <p>Vào chợ trao đổi đồ và bấm "Lưu / Bỏ lưu" để xem lại sau.</p>
                </div>
                <div class="table-wrapper" th:unless="${items.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th>Tên đồ</th>
                            <th>Hình thức</th>
                            <th>Giá</th>
                            <th>Trạng thái</th>
                            <th style="text-align: right;">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${items}">
                            <td class="font-bold" th:text="${item.title}"></td>
                            <td>
                                <span class="badge badge-info" th:if="${item.exchangeType == 'SELL'}">Bán</span>
                                <span class="badge badge-success" th:if="${item.exchangeType == 'GIVEAWAY'}">Cho tặng</span>
                                <span class="badge badge-purple" th:if="${item.exchangeType == 'EXCHANGE'}">Trao đổi</span>
                            </td>
                            <td class="font-bold text-success" th:text="${item.price != null ? #numbers.formatDecimal(item.price,0,'COMMA',0,'POINT') + ' đ' : 'Miễn phí'}"></td>
                            <td>
                                <span class="badge badge-success" th:if="${item.status == 'AVAILABLE'}">Đang hiển thị</span>
                                <span class="badge badge-warning" th:if="${item.status == 'PENDING'}">Đang giao dịch</span>
                                <span class="badge badge-secondary" th:if="${item.status != 'AVAILABLE' and item.status != 'PENDING'}" th:text="${item.status}"></span>
                            </td>
                            <td style="text-align: right;">
                                <div class="flex gap-2" style="justify-content: flex-end;">
                                    <a th:href="@{/exchange/{id}(id=${item.id})}" class="btn btn-ghost btn-sm">
                                        <i class="bi bi-eye"></i> Xem
                                    </a>
                                    <form th:action="@{/exchange/favorites/{id}/toggle(id=${item.id})}"
                                          method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            <i class="bi bi-bookmark-x"></i> Bỏ lưu
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
