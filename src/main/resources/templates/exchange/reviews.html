<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Đánh giá')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    <div class="main-content">
        <div class="topbar"><div class="topbar-title">⭐ Đánh giá giao dịch</div></div>
        <div class="page-content">
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="stat-card yellow"><div class="stat-icon">⭐</div>
                    <div class="stat-value"
                         th:text="${average != null ? #numbers.formatDecimal(average,1,'COMMA',1,'POINT') : '—'}">—</div>
                    <div class="stat-label">Điểm trung bình bạn nhận được</div></div>
                <div class="stat-card blue"><div class="stat-icon">💬</div>
                    <div class="stat-value" th:text="${received.size()}">0</div>
                    <div class="stat-label">Lượt đánh giá nhận được</div></div>
            </div>

            <!-- Form: chỉ hiện khi có ?requestId= -->
            <div class="card" th:if="${requestId != null}" style="margin-top:24px;">
                <div class="card-header"><span class="card-title" th:text="'Đánh giá giao dịch #' + ${requestId}"></span></div>
                <div class="card-body">
                    <form th:action="@{/exchange/reviews}" method="post">
                        <input type="hidden" name="requestId" th:value="${requestId}">
                        <div class="form-group">
                            <label class="form-label">Điểm *</label>
                            <select class="form-control" name="rating" required>
                                <option value="5">5 - Rất tốt</option>
                                <option value="4">4 - Tốt</option>
                                <option value="3">3 - Bình thường</option>
                                <option value="2">2 - Chưa tốt</option>
                                <option value="1">1 - Tệ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nhận xét</label>
                            <textarea class="form-control" name="comment" rows="3"></textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">Gửi đánh giá</button>
                    </form>
                </div>
            </div>

            <div class="card" style="margin-top:24px;">
                <div class="card-header"><span class="card-title">📥 Đánh giá bạn nhận được</span></div>
                <div class="card-body" style="padding:0;">
                    <div class="empty-state" th:if="${received.isEmpty()}"><h3>Chưa có đánh giá nào</h3></div>
                    <div class="table-wrapper" th:unless="${received.isEmpty()}">
                        <table>
                            <thead><tr><th>Từ</th><th>Điểm</th><th>Nhận xét</th><th>Ngày</th></tr></thead>
                            <tbody>
                            <tr th:each="r : ${received}">
                                <td th:text="${names[r.reviewerId]}"></td>
                                <td th:text="${r.rating} + ' ⭐'"></td>
                                <td th:text="${r.comment}"></td>
                                <td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top:24px;">
                <div class="card-header"><span class="card-title">📤 Đánh giá bạn đã viết</span></div>
                <div class="card-body" style="padding:0;">
                    <div class="empty-state" th:if="${written.isEmpty()}"><h3>Bạn chưa viết đánh giá nào</h3></div>
                    <div class="table-wrapper" th:unless="${written.isEmpty()}">
                        <table>
                            <thead><tr><th>Cho</th><th>Điểm</th><th>Nhận xét</th><th>Ngày</th></tr></thead>
                            <tbody>
                            <tr th:each="r : ${written}">
                                <td th:text="${names[r.revieweeId]}"></td>
                                <td th:text="${r.rating} + ' ⭐'"></td>
                                <td th:text="${r.comment}"></td>
                                <td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
