<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Báo cáo tin đăng')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-flag"></i> Báo cáo tin đăng</div>
                <div class="topbar-subtitle">Phản ánh tin đăng không phù hợp với quy định KTX</div>
            </div>
            <div class="topbar-right">
                <a th:href="@{/exchange/{id}(id=${item.id})}" class="btn btn-ghost btn-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại tin đăng
                </a>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>
            <div class="card form-container-sm">
                <div class="card-header">
                    <span class="card-title" th:text="'Tin: ' + ${item.title}"></span>
                </div>
                <div class="card-body">
                    <form th:action="@{/exchange/reports}" method="post">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <div class="form-group">
                            <label class="form-label">Lý do *</label>
                            <select class="form-control" name="reason" required>
                                <option value="">-- Chọn lý do --</option>
                                <option th:each="r : ${reasons}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mô tả thêm</label>
                            <textarea class="form-control" name="description" rows="4"
                                      placeholder="Mô tả vấn đề bạn gặp..."></textarea>
                        </div>
                        <div class="flex gap-3">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-flag"></i> Gửi báo cáo
                            </button>
                            <a th:href="@{/exchange}" class="btn btn-ghost">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
