<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Lịch sử yêu cầu gia hạn')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-calendar2-plus"></i> Lịch sử yêu cầu gia hạn</div>
                <div class="topbar-subtitle">Theo dõi trạng thái phê duyệt gia hạn hợp đồng lưu trú</div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-ghost" th:href="@{/student/contracts}">
                    <i class="bi bi-arrow-left"></i> Quay lại hợp đồng
                </a>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Phòng</th>
                                <th>Xin gia hạn đến</th>
                                <th>Lý do</th>
                                <th>Ngày gửi</th>
                                <th>Trạng thái</th>
                                <th>Ghi chú từ BQL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r, i : ${requests}">
                                <td class="text-muted" th:text="${i.count}"></td>
                                <td class="font-bold" th:text="${r.contract.room.building.name + ' - ' + r.contract.room.roomNumber}"></td>
                                <td class="font-bold text-primary" th:text="${r.newEndDate}"></td>
                                <td class="text-secondary" th:text="${r.reason}"></td>
                                <td class="text-muted text-sm" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span th:if="${r.status.name() == 'PENDING'}"   class="badge badge-warning">Chờ duyệt</span>
                                    <span th:if="${r.status.name() == 'APPROVED'}"  class="badge badge-success">Đã duyệt</span>
                                    <span th:if="${r.status.name() == 'REJECTED'}"  class="badge badge-danger">Từ chối</span>
                                </td>
                                <td>
                                    <span th:if="${r.status.name() == 'REJECTED'}" class="text-danger" th:text="${r.rejectReason}"></span>
                                    <span th:if="${r.status.name() == 'APPROVED'}" class="text-success">Thành công</span>
                                    <span th:if="${r.status.name() == 'PENDING'}" class="text-muted">Đang xem xét</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(requests)}">
                                <td colspan="7">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-calendar2-check"></i></div>
                                        <h3>Chưa có yêu cầu gia hạn nào</h3>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
