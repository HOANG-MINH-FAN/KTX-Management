<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Đăng ký phòng')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: studentSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title">📝 Đăng ký phòng ở</div>
                <div class="topbar-subtitle">Chọn phòng phù hợp và gửi đơn đăng ký</div>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <div class="card" style="max-width:600px;">
                <div class="card-header"><span class="card-title">📋 Thông tin đăng ký</span></div>
                <div class="card-body">
                    <form th:action="@{/student/register}" method="post">

                        <div class="form-group">
                            <label class="form-label">Chọn phòng *</label>
                            <select class="form-control" name="roomId" required>
                                <option value="">-- Chọn phòng --</option>
                                <option th:each="r : ${availableRooms}"
                                        th:value="${r.id}"
                                        th:text="${r.building?.name} + ' - Phòng ' + ${r.roomNumber}
                                                  + ' (Chỗ trống: ' + ${r.availableSlots} + '/'
                                                  + ${r.capacity} + ') — '
                                                  + ${#numbers.formatDecimal(r.roomFeePerMonth,1,'COMMA',0,'POINT')} + 'đ/tháng'">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ngày muốn vào ở *</label>
                            <input class="form-control" type="date" name="desiredStartDate" required
                                   th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ghi chú (tùy chọn)</label>
                            <textarea class="form-control" name="note" rows="3"
                                      placeholder="Ghi chú thêm cho quản trị viên..."></textarea>
                        </div>

                        <div class="alert alert-info">
                            ℹ️ Sau khi gửi, quản trị viên sẽ xem xét và duyệt đơn của bạn.
                            Khi được duyệt, hợp đồng sẽ tự động được tạo.
                        </div>

                        <button class="btn btn-primary" type="submit">📤 Gửi đơn đăng ký</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
