<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Thống kê trao đổi đồ')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: adminSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-bar-chart-line"></i> Thống kê Trao đổi đồ</div>
                <div class="topbar-subtitle">Số liệu tổng hợp hoạt động trao đổi đồ dùng sinh viên</div>
            </div>
        </div>
        <div class="page-content">
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-icon"><i class="bi bi-box-seam"></i></div>
                    <div class="stat-value" th:text="${total}">0</div>
                    <div class="stat-label">Tổng tin đăng</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
                    <div class="stat-value" th:text="${active}">0</div>
                    <div class="stat-label">Tin đang hoạt động</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-icon"><i class="bi bi-arrow-left-right"></i></div>
                    <div class="stat-value" th:text="${completed}">0</div>
                    <div class="stat-label">Giao dịch hoàn thành</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon"><i class="bi bi-recycle"></i></div>
                    <div class="stat-value" th:text="${reused}">0</div>
                    <div class="stat-label">Đồ được tái sử dụng</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-icon"><i class="bi bi-flag"></i></div>
                    <div class="stat-value" th:text="${pendingReports}">0</div>
                    <div class="stat-label">Báo cáo chờ xử lý</div>
                </div>
            </div>

            <h3 style="margin: 24px 0 12px;">Phân tích hoạt động</h3>
            <div class="card" style="margin-bottom: 20px;">
                <div class="card-header"><span class="card-title">Theo danh mục</span></div>
                <div class="card-body" style="height: 300px;"><canvas id="categoryChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const categoryData = /*[[${categoryStats}]]*/ {};

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(categoryData),
            datasets: [{ data: Object.values(categoryData), backgroundColor: '#4f9cf9', borderRadius: 6 }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>
</body>
</html>
