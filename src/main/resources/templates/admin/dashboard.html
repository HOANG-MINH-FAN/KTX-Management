<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/sidebar :: head('Dashboard Admin')}"></head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <div th:replace="~{layout/sidebar :: adminSidebar}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-grid-1x2"></i> Bảng điều khiển Quản trị</div>
                <div class="topbar-subtitle">Tổng quan vận hành hệ thống ký túc xá sinh viên</div>
            </div>
        </div>

        <div class="page-content">

            <!-- Alerts -->
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <!-- Stat Cards -->
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-icon"><i class="bi bi-door-open"></i></div>
                    <div class="stat-value" th:text="${totalRooms}">0</div>
                    <div class="stat-label">Tổng số phòng</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-icon"><i class="bi bi-people"></i></div>
                    <div class="stat-value" th:text="${totalStudentsInDorm}">0</div>
                    <div class="stat-label">Sinh viên đang ở</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-icon"><i class="bi bi-box"></i></div>
                    <div class="stat-value" th:text="${emptyPlaces}">0</div>
                    <div class="stat-label">Chỗ trống còn lại</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon"><i class="bi bi-journal-check"></i></div>
                    <div class="stat-value" th:text="${pendingRegistrations}">0</div>
                    <div class="stat-label">Đơn chờ duyệt</div>
                </div>
                <div class="stat-card yellow">
                    <div class="stat-icon"><i class="bi bi-receipt"></i></div>
                    <div class="stat-value" th:text="${unpaidInvoices}">0</div>
                    <div class="stat-label">Hóa đơn chưa trả</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-icon"><i class="bi bi-shield-exclamation"></i></div>
                    <div class="stat-value" th:text="${unpaidViolations}">0</div>
                    <div class="stat-label">Vi phạm chưa xử lý</div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card mb-6">
                <div class="card-header">
                    <span class="card-title"><i class="bi bi-lightning-charge"></i> Nghiệp vụ thường dùng</span>
                </div>
                <div class="card-body">
                    <div class="flex flex-wrap gap-3">
                        <a class="btn btn-primary" th:href="@{/admin/registrations}">
                            <i class="bi bi-journal-check"></i> Duyệt đơn đăng ký
                        </a>
                        <a class="btn btn-primary" th:href="@{/admin/invoices/create}">
                            <i class="bi bi-receipt"></i> Tạo hóa đơn tháng
                        </a>
                        <a class="btn btn-ghost" th:href="@{/admin/students/new}">
                            <i class="bi bi-person-plus"></i> Thêm sinh viên
                        </a>
                        <a class="btn btn-ghost" th:href="@{/admin/rooms/new}">
                            <i class="bi bi-plus-square"></i> Thêm phòng ở
                        </a>
                        <a class="btn btn-ghost" th:href="@{/admin/violations}">
                            <i class="bi bi-shield-exclamation"></i> Quản lý vi phạm
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
