<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Quản lý Tòa nhà')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: adminSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-building"></i> Quản lý Tòa nhà</div>
                <div class="topbar-subtitle">Danh sách các tòa nhà trực thuộc khu ký túc xá</div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-primary" th:href="@{/admin/buildings/new}">
                    <i class="bi bi-plus-lg"></i> Thêm tòa nhà
                </a>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Tên tòa nhà</th>
                                <th>Địa chỉ</th>
                                <th>Số tầng</th>
                                <th>Số phòng</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b, i : ${buildings}">
                                <td class="text-muted" th:text="${i.count}"></td>
                                <td class="font-bold" th:text="${b.name}"></td>
                                <td class="text-secondary" th:text="${b.address ?: '—'}"></td>
                                <td th:text="${b.totalFloors}"></td>
                                <td><span class="badge badge-info" th:text="${b.totalRooms}"></span></td>
                                <td>
                                    <div class="flex gap-2">
                                        <a class="btn btn-sm btn-ghost" th:href="@{/admin/buildings/edit/{id}(id=${b.id})}" title="Chỉnh sửa">
                                            <i class="bi bi-pencil"></i> Sửa
                                        </a>
                                        <form th:action="@{/admin/buildings/delete/{id}(id=${b.id})}" method="post"
                                              onsubmit="return confirm('Xóa tòa nhà này?')">
                                            <button class="btn btn-sm btn-danger" type="submit" title="Xóa">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(buildings)}">
                                <td colspan="6">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-building"></i></div>
                                        <h3>Chưa có tòa nhà nào</h3>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
