<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Chi tiết sinh viên')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: adminSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-person-vcard"></i> Chi tiết Sinh viên</div>
                <div class="topbar-subtitle" th:text="${student.fullName} + ' (' + ${student.studentCode} + ')'"></div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-ghost" th:href="@{/admin/students/edit/{id}(id=${student.id})}">
                    <i class="bi bi-pencil"></i> Chỉnh sửa
                </a>
                <a class="btn btn-ghost" th:href="@{/admin/students}">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>
        </div>
        <div class="page-content">
            <div class="card form-container-lg">
                <div class="card-header">
                    <span class="card-title"><i class="bi bi-info-circle"></i> Thông tin cá nhân</span>
                </div>
                <div class="card-body">
                    <div class="detail-grid">
                        <div class="detail-list">
                            <div class="detail-row">
                                <span class="detail-label">Mã sinh viên</span>
                                <span class="detail-value" th:text="${student.studentCode}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Họ và tên</span>
                                <span class="detail-value" th:text="${student.fullName}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Tài khoản (Username)</span>
                                <span class="detail-value" th:text="${student.username}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Khoa / Ngành</span>
                                <span class="detail-value" th:text="${student.faculty ?: '—'}"></span>
                            </div>
                        </div>
                        <div class="detail-list">
                            <div class="detail-row">
                                <span class="detail-label">Ngày sinh</span>
                                <span class="detail-value" th:text="${student.dateOfBirth ?: '—'}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Giới tính</span>
                                <span class="detail-value">
                                    <span th:if="${student.gender == 'MALE'}">Nam</span>
                                    <span th:if="${student.gender == 'FEMALE'}">Nữ</span>
                                    <span th:if="${student.gender == null}">—</span>
                                </span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Điện thoại</span>
                                <span class="detail-value" th:text="${student.phone ?: '—'}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Email</span>
                                <span class="detail-value" th:text="${student.email ?: '—'}"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Quê quán</span>
                                <span class="detail-value" th:text="${student.hometown ?: '—'}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
