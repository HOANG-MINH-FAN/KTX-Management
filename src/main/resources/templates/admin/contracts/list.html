<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/sidebar :: head('Quản lý Hợp đồng')}"></head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: adminSidebar}"></div>
    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-file-earmark-text"></i> Quản lý Hợp đồng</div>
                <div class="topbar-subtitle">Theo dõi hiệu lực hợp đồng lưu trú của sinh viên</div>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Sinh viên</th>
                                <th>Phòng</th>
                                <th>Bắt đầu</th>
                                <th>Kết thúc</th>
                                <th>Tiền/tháng</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c, i : ${contracts}">
                                <td class="text-muted" th:text="${i.count}"></td>
                                <td>
                                    <div class="font-bold" th:text="${c.student?.fullName}"></div>
                                    <div class="text-muted text-sm" th:text="${c.student?.studentCode}"></div>
                                </td>
                                <td th:text="${c.room?.building?.name + ' - ' + c.room?.roomNumber}"></td>
                                <td th:text="${c.startDate}"></td>
                                <td th:text="${c.endDate}"></td>
                                <td class="font-bold" th:text="${#numbers.formatDecimal(c.monthlyFee,1,'COMMA',0,'POINT')} + ' đ'"></td>
                                <td>
                                    <span th:if="${c.status?.name() == 'ACTIVE'}"      class="badge badge-success">Đang hiệu lực</span>
                                    <span th:if="${c.status?.name() == 'EXPIRED'}"     class="badge badge-secondary">Hết hạn</span>
                                    <span th:if="${c.status?.name() == 'TERMINATED'}"  class="badge badge-danger">Đã kết thúc</span>
                                </td>
                                <td>
                                    <div th:if="${c.status?.name() == 'ACTIVE'}" class="flex flex-wrap gap-2" style="align-items: center;">
                                        <form th:action="@{/admin/contracts/renew/{id}(id=${c.id})}" method="post"
                                              class="flex gap-2" style="align-items: center;">
                                            <input type="date" name="newEndDate" class="form-control" style="padding: 4px 8px; font-size: 0.78rem; width: 140px;" required>
                                            <button class="btn btn-sm btn-success" type="submit">
                                                <i class="bi bi-calendar-plus"></i> Gia hạn
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/contracts/terminate/{id}(id=${c.id})}" method="post"
                                              onsubmit="return confirm('Kết thúc sớm hợp đồng này?')">
                                            <button class="btn btn-sm btn-danger" type="submit">
                                                <i class="bi bi-x-circle"></i> Kết thúc
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(contracts)}">
                                <td colspan="8">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-file-earmark-text"></i></div>
                                        <h3>Chưa có hợp đồng nào</h3>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
